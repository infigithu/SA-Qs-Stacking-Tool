<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Question Builder</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-soft:#f9fafb;
  --surface-muted:#f3f4f6;
  --border:#e5e7eb;
  --border-strong:#d1d5db;
  --text:#0f172a;
  --text-muted:#64748b;
  --text-soft:#94a3b8;
  --primary:#0f172a;
  --primary-hover:#1e293b;
  --success:#0f766e;
  --success-soft:#ecfdf5;
  --blue:#2563eb;
  --blue-soft:#eff6ff;
  --amber:#b45309;
  --amber-soft:#fff7ed;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 12px 32px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.10);
  --radius:14px;
  --radius-lg:18px;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at top,#ffffff 0,#f7f8fa 42%,var(--bg) 100%);min-height:100vh;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}

/* ------- Topbar ------- */
.topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{font-size:16px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#box-count{min-width:80px;text-align:right;font-size:12px;color:var(--text-muted);font-weight:600}
/* Hide the legacy top "+ Add Box" button entirely (kept in DOM for JS safety) */
.top-add-btn{display:none!important}

/* ------- Buttons ------- */
.btn{min-height:38px;padding:9px 16px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);font-size:13px;cursor:pointer;font-weight:600;color:var(--text);transition:background .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1;white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--surface-muted);border-color:#cbd5e1;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid rgba(37,99,235,.18);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-green{background:var(--success);color:#fff;border-color:var(--success)}
.btn-green:hover{background:#115e59;border-color:#115e59}
.btn-sm{min-height:32px;padding:7px 12px;font-size:12px;border-radius:9px}
.btn-amber{background:var(--amber-soft);color:#9a3412;border-color:#fed7aa;font-size:12px;padding:7px 12px;min-height:34px}
.btn-amber:hover{background:#ffedd5;border-color:#fdba74;color:#7c2d12}
.btn-blue{background:var(--blue-soft);color:#1d4ed8;border-color:#bfdbfe;font-size:12px;padding:7px 12px;min-height:34px}
.btn-blue:hover{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-muted)}
.btn-ghost:hover{background:var(--surface-muted);color:var(--text)}

/* ------- Workspace ------- */
.workspace{padding:28px 24px 48px;max-width:1360px;margin:0 auto}

/* Settings card (Spreadsheet + sheet selector) */
.settings-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:rgba(255,255,255,.94);box-shadow:var(--shadow-md);padding:20px;margin-bottom:22px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end}
@media(max-width:780px){.settings-grid{grid-template-columns:1fr}}
.field-label{display:block;font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
#spreadsheet_id,#sheet_selector,.fix-area input{width:100%;border:1px solid var(--border-strong)!important;border-radius:11px!important;background:#fff!important;color:var(--text)!important;min-height:42px;padding:10px 12px!important;font-size:13px;transition:border-color .16s,box-shadow .16s}
#spreadsheet_id:focus,#sheet_selector:focus,.fix-area input:focus{border-color:var(--blue)!important;box-shadow:0 0 0 4px rgba(37,99,235,.12)!important;outline:none!important}
.input-row{display:flex;gap:8px}
.input-row #spreadsheet_id{flex:1}
button[onclick="fetchSheets()"]{min-height:42px;padding:0 16px;border-radius:11px!important;background:var(--primary)!important;color:#fff!important;border:1px solid var(--primary)!important;font-weight:700!important;box-shadow:var(--shadow-sm)!important;font-size:13px;cursor:pointer;transition:background .16s}
button[onclick="fetchSheets()"]:hover{background:var(--primary-hover)!important;border-color:var(--primary-hover)!important}

/* Section heading */
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.section-heading h2{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase}
.section-heading .hint{font-size:12px;color:var(--text-soft)}

/* ------- Boxes grid ------- */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{padding:20px 14px 36px}.topbar{padding:12px 14px}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.topbar-right .btn{flex:1}}

.box{background:rgba(255,255,255,.96);border:1.5px dashed var(--border-strong);border-radius:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s,background .18s;position:relative;padding:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.box:hover{border-color:#94a3b8;box-shadow:0 14px 36px rgba(15,23,42,.08);transform:translateY(-2px)}
.box.has-images{border-style:solid;border-color:#99f6e4;cursor:default;align-items:stretch;justify-content:flex-start;background:linear-gradient(180deg,#ffffff 0%,#f8fffd 100%)}
.box.generated{border-color:#93c5fd;background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%)}
.box.verified{border-color:#5eead4;background:linear-gradient(180deg,#ffffff 0%,var(--success-soft) 100%)}
.box.drag-over{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 4px rgba(37,99,235,.12),var(--shadow-md);transform:translateY(-2px)}

.box-empty-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface-muted);font-size:22px;color:#94a3b8;margin-bottom:10px}
.box-empty-text{font-size:13px;color:var(--text);font-weight:700;text-align:center}
.drop-hint{margin-top:6px;font-size:11px;color:var(--text-soft);text-align:center}

.box-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.box-num{font-size:11px;font-weight:800;color:var(--text);background:var(--surface-muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;letter-spacing:.04em}
.box-status{font-size:11px;color:var(--text-muted);font-weight:600}

/* Image thumbnails with hover delete */
.thumb-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.thumb-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface-muted);aspect-ratio:1/1}
.thumb-wrap img.thumb{width:100%;height:100%;object-fit:cover;display:block}
.thumb-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;border:none;background:rgba(15,23,42,.72);color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s,background .15s;padding:0;z-index:3}
.thumb-wrap:hover .thumb-remove{opacity:1;transform:scale(1)}
.thumb-remove:hover{background:var(--danger)}

/* Add-more tile inside an active box */
.thumb-add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--border-strong);border-radius:10px;color:var(--text-soft);font-size:20px;cursor:pointer;background:#fff;transition:border-color .15s,color .15s,background .15s;aspect-ratio:1/1}
.thumb-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

.solution-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);font-weight:600;margin-top:auto;padding-top:8px;border-top:1px dashed var(--border)}
.toggle-switch{position:relative;width:34px;height:20px;flex:0 0 auto}
.toggle-switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:999px;transition:.2s}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
input:checked+.slider{background:var(--success)}
input:checked+.slider:before{transform:translateX(14px)}

/* Hover-only delete button on every box */
.remove-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,.95);border:1px solid var(--border);color:var(--text-soft);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;pointer-events:none;transform:scale(.9);transition:opacity .15s,transform .15s,background .15s,color .15s,border-color .15s;z-index:5;box-shadow:var(--shadow-sm)}
.box:hover .remove-btn,.result-card:hover .remove-btn{opacity:1;pointer-events:auto;transform:scale(1)}
.remove-btn:hover{background:var(--danger-soft);border-color:#fecaca;color:var(--danger)}

.add-box-row{display:flex;justify-content:flex-end;margin-bottom:24px}
input[type=file]{display:none}

/* ------- Result cards ------- */
.result-section{margin-top:26px}
.result-card{background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.result-card.verified-card{border-color:#99f6e4;background:linear-gradient(180deg,#fff 0%,#fbfffd 100%)}
.result-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.result-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.4}
.status-badge{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.badge-generated{background:var(--blue-soft);color:#1d4ed8;border-color:#bfdbfe}
.badge-verified{background:var(--success-soft);color:#0f766e;border-color:#99f6e4}
.badge-error{background:var(--danger-soft);color:#991b1b;border-color:#fecaca}

.section-label{font-size:11px;color:var(--text-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.latex-question,.latex-solution{line-height:1.85;background:var(--surface-soft);border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:16px;color:var(--text);overflow-x:auto}
.latex-question{font-size:20px}
.latex-solution{font-size:17px}
.options-wrap{margin-bottom:14px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 12px}

.fields-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
@media(max-width:900px){.fields-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fields-grid{grid-template-columns:1fr}.result-header{align-items:flex-start;flex-direction:column}.result-actions{width:100%}}
.field-item{background:var(--surface-soft);border:1px solid var(--border);border-radius:13px;padding:11px 12px;min-height:62px}
.field-label-sm{font-size:10px;color:var(--text-soft);margin-bottom:4px;text-transform:uppercase;font-weight:800;letter-spacing:.05em}
.field-value{font-size:13px;color:var(--text);font-weight:600;line-height:1.4;word-break:break-word}

.result-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.fix-area{margin-top:14px;display:none;background:var(--surface-soft);border:1px solid var(--border);border-radius:14px;padding:12px}
.fix-area .fix-row{display:flex;gap:8px;align-items:center}
.fix-area input{margin:0!important;flex:1}
@media(max-width:520px){.fix-area .fix-row{flex-direction:column;align-items:stretch}}
.verify-result{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid transparent}
.verify-ok{background:var(--success-soft);color:#065f46;border-color:#99f6e4}
.verify-fail{background:var(--danger-soft);color:#991b1b;border-color:#fecaca}

/* ------- Figure / image upload panel (redesigned) ------- */
.figure-panel{margin:18px 0;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,#fff 0%,#f9fafb 100%);box-shadow:var(--shadow-sm);overflow:hidden}
.figure-panel-main{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:14px 16px}
.figure-panel-main input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.figure-panel-title{font-weight:800;font-size:14px;color:var(--text);display:block;line-height:1.35}
.figure-panel-subtitle{font-size:12px;color:var(--text-muted);display:block;margin-top:3px;line-height:1.4}
.figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 16px;border-top:1px solid var(--border);padding-top:14px}
@media(max-width:700px){.figure-grid{grid-template-columns:1fr}}

.figure-upload-card{position:relative;border:1px solid var(--border);background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .16s,box-shadow .16s}
.figure-upload-card:hover{border-color:#cbd5e1;box-shadow:var(--shadow-sm)}
.figure-upload-title{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;justify-content:space-between}
.figure-upload-title .count{background:var(--surface-muted);color:var(--text);border-radius:999px;padding:2px 8px;font-size:10px}
.figure-dropzone{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:18px 12px;background:var(--surface-soft);color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,color .15s}
.figure-dropzone:hover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.figure-dropzone .ico{font-size:18px}
.figure-file-input{display:none!important}
.figure-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.figure-thumbs:empty{display:none}
.figure-thumbs .thumb-wrap{aspect-ratio:1/1}
.fig-error{display:none;margin:0 16px 14px;background:var(--danger-soft);color:#991b1b;border:1px solid #fecaca;font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px}
.fig-error.visible{display:block}

/* ------- Progress ------- */
.send-progress{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:24px;display:none;box-shadow:var(--shadow-md)}
.progress-bar{height:8px;background:var(--surface-muted);border-radius:999px;overflow:hidden;margin:13px 0}
.progress-fill{height:100%;background:var(--success);border-radius:999px;transition:width .3s}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inline-flex items-center bg-white border border-slate-200 shadow-sm rounded-2xl p-1">
      <span class="px-4 py-1.5 text-sm font-black text-slate-800 tracking-tight">
          JEE Question Builder
      </span>
      <div class="w-px h-5 bg-slate-200 mx-1"></div>
      <a href="/validator" target="_blank" class="flex items-center gap-1.5 px-4 py-1.5 text-sm font-bold text-indigo-600 bg-transparent hover:bg-indigo-50 rounded-xl transition-colors cursor-pointer" style="text-decoration: none;">
          QA Validator
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
      </a>
  </div>

  <div class="topbar-right">
    <span id="box-count"></span>
    <!-- Legacy top "+ Add Box" kept hidden for JS-safety (display:none) -->
    <button class="btn top-add-btn" onclick="addBox()" aria-hidden="true" tabindex="-1">+ Add Box</button>
    <button class="btn btn-primary" onclick="generateAll()" id="generate-btn">Generate All</button>
    <button class="btn btn-green" onclick="sendAll()" id="send-btn" disabled>Send to Sheets</button>
  </div>
</div>

<div class="workspace">

  <!-- Settings card -->
  <div class="settings-card">
    <div class="settings-grid">
      <div>
        <label class="field-label" for="spreadsheet_id">Google Spreadsheet ID</label>
        <div class="input-row">
          <input type="text" id="spreadsheet_id" placeholder="Paste ID here (e.g., 1BxiMVs0XRY...)">
          <button onclick="fetchSheets()">Fetch Sheets</button>
        </div>
      </div>
      <div>
        <label class="field-label" for="sheet_selector">Select Sub-Sheet</label>
        <select id="sheet_selector">
          <option value="">Fetch sheets first...</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Send progress -->
  <div class="send-progress" id="send-progress">
    <div style="font-size:14px;font-weight:700;margin-bottom:4px">Sending to Google Sheets & Telegram...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="progress-text" style="font-size:13px;color:var(--text-muted)">0 / 0 sent</div>
  </div>

  <!-- Questions section -->
  <div class="section-heading">
    <h2>Question Boxes</h2>
    <span class="hint">Drop or click to upload images · Hover a box to remove it</span>
  </div>

  <div class="grid" id="box-grid"></div>
  <div class="add-box-row">
    <button class="btn" onclick="addBox()">+ Add Box</button>
  </div>

  <div class="result-section" id="result-section"></div>
</div>

<script>
let boxes = [];
let results = {};
let boxCounter = 0;
let figureFiles = {}; 


// ----------------------Claudflare-----------------------
async function convertToLatex(expression) {
  const res = await fetch("/api/latex", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ expression }),
  });

  const data = await res.json();
  return data.latex;
}

// ---------------------------------------------------------
  
async function fetchSheets() {
    const sheetId = document.getElementById('spreadsheet_id').value.trim();
    if (!sheetId) return alert('Please paste a Spreadsheet ID');

    localStorage.setItem('savedSpreadsheetId', sheetId);

    const selector = document.getElementById('sheet_selector');
    selector.innerHTML = '<option value="">Loading...</option>';

    try {
        const res = await fetch(`/get_sheets?spreadsheet_id=${sheetId}`);
        const data = await res.json();

        if (data.sheets) {
            selector.innerHTML = '<option value="">Select a sheet...</option>';
            data.sheets.forEach(name => {
                selector.innerHTML += `<option value="${name}">${name}</option>`;
            });
        } else {
            selector.innerHTML = '<option value="">⚠ Error loading sheets</option>';
            alert('Error fetching sheets: ' + data.error);
        }
    } catch (e) {
        alert('Server error while fetching sheets.');
    }
}

function toggleFigures(id) {
    const container = document.getElementById(`figures-container-${id}`);
    const checkbox = document.getElementById(`toggle-fig-${id}`);
    if (checkbox.checked) container.classList.remove('hidden');
    else container.classList.add('hidden');
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

function addBox() {
  boxCounter++;
  const id = boxCounter;
  boxes.push({ id, images: [], solutionIncluded: true, verified: false });
  renderBoxes();
  updateCount();
}

function removeBox(id) {
  boxes = boxes.filter(b => b.id !== id);
  delete results[id];
  delete figureFiles[id];
  renderBoxes();
  renderResults();
  updateCount();
}

// NEW: Remove a single uploaded image from a box (hover-X on thumbnail)
function removeImage(boxId, idx) {
  const box = boxes.find(b => b.id === boxId);
  if (!box) return;
  box.images.splice(idx, 1);
  renderBoxes();
  updateCount();
}

function updateCount() {
  const filled = boxes.filter(b => b.images.length > 0).length;
  document.getElementById('box-count').textContent = filled > 0 ? `${filled} box${filled>1?'es':''} ready` : '';
}

function renderBoxes() {
  const grid = document.getElementById('box-grid');
  grid.innerHTML = '';
  boxes.forEach(box => {
    const div = document.createElement('div');
    div.className = 'box' + (box.images.length > 0 ? ' has-images' : '') + (results[box.id] ? (box.verified ? ' verified' : ' generated') : '');
    div.dataset.id = box.id;
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => { e.preventDefault(); div.classList.remove('drag-over'); handleDrop(box.id, e.dataTransfer.files); });

    // Hover-only delete X always present
    const removeBtn = `<button type="button" class="remove-btn" aria-label="Remove Q${box.id}" title="Remove Q${box.id}" onclick="event.stopPropagation(); removeBox(${box.id})">×</button>`;

    if (box.images.length === 0) {
      div.innerHTML = `
        ${removeBtn}
        <div class="box-empty-icon">📎</div>
        <div class="box-empty-text">Q${box.id} · Image Box</div>
        <div class="drop-hint">Drop images here or click to browse</div>
      `;
      div.onclick = (e) => { if (!e.target.closest('button')) browseFiles(box.id); };
    } else {
      const thumbs = box.images.map((img, idx) => `
        <div class="thumb-wrap">
          <img class="thumb" src="${img.data}" alt="image ${idx+1}">
          <button type="button" class="thumb-remove" aria-label="Remove image ${idx+1}" title="Remove image" onclick="event.stopPropagation(); removeImage(${box.id}, ${idx})">×</button>
        </div>
      `).join('');
      const canAddMore = box.images.length < 6;
      const addTile = canAddMore ? `<div class="thumb-add" title="Add more images" onclick="event.stopPropagation(); browseFiles(${box.id})">+</div>` : '';

      div.innerHTML = `
        ${removeBtn}
        <div class="box-header">
          <div class="box-num">Q${box.id}</div>
          <div class="box-status">${box.images.length}/6 image${box.images.length>1?'s':''}</div>
        </div>
        <div class="thumb-row">${thumbs}${addTile}</div>
        <label class="solution-toggle">
          <span class="toggle-switch">
            <input type="checkbox" ${box.solutionIncluded ? 'checked' : ''} onchange="toggleSolution(${box.id}, this.checked)">
            <span class="slider"></span>
          </span>
          Solution included
        </label>
      `;
      // Background click no longer auto-opens file picker — use the + tile instead, to avoid accidental dialogs.
    }
    grid.appendChild(div);
  });
}

function browseFiles(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.accept = 'image/*';
  input.onchange = e => handleFiles(id, e.target.files);
  input.click();
}

function handleDrop(id, files) {
  handleFiles(id, files);
}

function handleFiles(id, files) {
  const box = boxes.find(b => b.id === id);
  if (!box) return;
  const remaining = 6 - box.images.length;
  const toAdd = Array.from(files).slice(0, remaining);
  let loaded = 0;
  if (toAdd.length === 0) return;
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const data = e.target.result;
      const b64 = data.split(',')[1];
      box.images.push({ data, b64 });
      loaded++;
      if (loaded === toAdd.length) { renderBoxes(); updateCount(); }
    };
    reader.readAsDataURL(file);
  });
}

function toggleSolution(id, checked) {
  const box = boxes.find(b => b.id === id);
  if (box) box.solutionIncluded = checked;
}

async function generateAll() {
  const ready = boxes.filter(b => b.images.length > 0 && !results[b.id]);

  if (ready.length === 0) {
      alert('Add images to at least one box (or all boxes are already generated)!');
      return;
  }

  const btn = document.getElementById('generate-btn');
  btn.disabled = true;

  for (let i = 0; i < ready.length; i++) {
      const currentBox = ready[i];
      btn.innerHTML = `<span class="loading"></span>Generating ${i + 1} of ${ready.length}...`;
      await generateBox(currentBox);
      renderResults();
      renderBoxes();
  }

  btn.innerHTML = 'Generate All';
  btn.disabled = false;
}

async function generateBox(box) {
  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: box.images.map(i => i.b64), solution_included: box.solutionIncluded })
    });

    if (!response.ok) {
        throw new Error(`Server Error: ${response.status} - Application failed to respond`);
    }

    const data = await response.json();

    if (data.status === "error") throw new Error(data.message || "Railway proxy timeout");
    if (data.error) throw new Error(data.error);

    results[box.id] = data;
  } catch (e) {
    results[box.id] = { error: e.message };
  }
}

// Re-render figure thumbs inside a result card after files are picked
function renderFigureThumbs(boxId, kind) {
  if (!figureFiles[boxId]) {
    figureFiles[boxId] = { q: [], s: [] };
  }

  const input = document.getElementById(`${kind}-figures-${boxId}`);
  const wrap = document.getElementById(`${kind}-figures-thumbs-${boxId}`);
  const countEl = document.getElementById(`${kind}-figures-count-${boxId}`);

  if (!input || !wrap || !countEl) return;

  // Add newly selected files to old files
  const newlySelected = Array.from(input.files || []);
  figureFiles[boxId][kind].push(...newlySelected);

  // Clear input so selecting another image later works
  input.value = '';

  const files = figureFiles[boxId][kind];

  countEl.textContent = files.length
    ? `${files.length} file${files.length > 1 ? 's' : ''}`
    : '0 files';

  wrap.innerHTML = '';

  files.forEach((file, idx) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const div = document.createElement('div');
      div.className = 'thumb-wrap';
      div.innerHTML = `
        <img class="thumb" src="${e.target.result}" alt="figure ${idx + 1}">
        <button 
          type="button" 
          class="thumb-remove" 
          title="Remove image" 
          aria-label="Remove image" 
          onclick="removeFigureImage(${boxId}, '${kind}', ${idx})"
        >×</button>
      `;
      wrap.appendChild(div);
    };

    reader.readAsDataURL(file);
  });
}

// Hover-X removal for a figure image (rebuilds the FileList via DataTransfer)
function removeFigureImage(boxId, kind, idx) {
  if (!figureFiles[boxId]) return;

  figureFiles[boxId][kind].splice(idx, 1);

  const wrap = document.getElementById(`${kind}-figures-thumbs-${boxId}`);
  const countEl = document.getElementById(`${kind}-figures-count-${boxId}`);

  if (!wrap || !countEl) return;

  const files = figureFiles[boxId][kind];

  countEl.textContent = files.length
    ? `${files.length} file${files.length > 1 ? 's' : ''}`
    : '0 files';

  wrap.innerHTML = '';

  files.forEach((file, newIdx) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const div = document.createElement('div');
      div.className = 'thumb-wrap';
      div.innerHTML = `
        <img class="thumb" src="${e.target.result}" alt="figure ${newIdx + 1}">
        <button 
          type="button" 
          class="thumb-remove" 
          title="Remove image" 
          aria-label="Remove image" 
          onclick="removeFigureImage(${boxId}, '${kind}', ${newIdx})"
        >×</button>
      `;
      wrap.appendChild(div);
    };

    reader.readAsDataURL(file);
  });
}

function renderResults() {
  const section = document.getElementById('result-section');
  section.innerHTML = '';
  let anyVerified = false;

  boxes.forEach(box => {
    if (!results[box.id]) return;
    const q = results[box.id];
    const isVerified = box.verified;
    if (isVerified) anyVerified = true;

    const card = document.createElement('div');
    card.className = 'result-card' + (isVerified ? ' verified-card' : '');
    card.id = `result-${box.id}`;

    if (q.error) {
      card.innerHTML = `
        <div class="result-header">
          <span class="result-title">Q${box.id}</span>
          <span class="status-badge badge-error">Error</span>
        </div>
        <div style="color:#791F1F;font-size:13px">${q.error}</div>
        <div style="margin-top:10px"><button class="btn btn-sm" onclick="retryBox(${box.id})">Retry</button></div>
      `;
    } else {
      let options = q.options || [];
      if (typeof options === 'string') {
          try { options = JSON.parse(options); } catch (e) { options = []; }
      }

      const optionsHtml = options.length > 0 ? options.map(o => `
        <div style="font-size:13px;padding:5px 0;color:${o.is_correct?'#085041':'#111'};font-weight:${o.is_correct?'700':'500'}">
          ${o.is_correct ? '✓' : '○'} <strong>${o.label}.</strong> ${o.text}
        </div>`).join('') : '<div style="font-size:13px;color:#888">Integer type — no options</div>';

      const figureUI = `
        <div class="figure-panel">
            <label class="figure-panel-main" for="toggle-fig-${box.id}">
                <input type="checkbox" id="toggle-fig-${box.id}" onchange="toggleFigures(${box.id})">
                <span>
                    <span class="figure-panel-title">Diagram / Figure attachments</span>
                    <span class="figure-panel-subtitle">Turn this on only when the question or solution needs extra figure images.</span>
                </span>
            </label>

            <div id="figures-container-${box.id}" class="hidden figure-grid">
                <div class="figure-upload-card">
                    <span class="figure-upload-title">Question Figures <span class="count" id="q-figures-count-${box.id}">0 files</span></span>
                    <label class="figure-dropzone" for="q-figures-${box.id}">
                      <span class="ico">🖼️</span><span>Click to upload question images</span>
                    </label>
                    <input type="file" multiple accept="image/*" id="q-figures-${box.id}" class="figure-file-input" onchange="renderFigureThumbs(${box.id},'q')">
                    <div class="figure-thumbs" id="q-figures-thumbs-${box.id}"></div>
                </div>
                <div class="figure-upload-card">
                    <span class="figure-upload-title">Solution Figures <span class="count" id="s-figures-count-${box.id}">0 files</span></span>
                    <label class="figure-dropzone" for="s-figures-${box.id}">
                      <span class="ico">📐</span><span>Click to upload solution images</span>
                    </label>
                    <input type="file" multiple accept="image/*" id="s-figures-${box.id}" class="figure-file-input" onchange="renderFigureThumbs(${box.id},'s')">
                    <div class="figure-thumbs" id="s-figures-thumbs-${box.id}"></div>
                </div>
            </div>
            <p id="fig-error-${box.id}" class="fig-error">⚠ Please add figures or turn off the switch.</p>
        </div>
      `;

      card.innerHTML = `
        <div class="result-header">
          <span class="result-title">Q${box.id} — ${q.title || ''}</span>
          <span class="status-badge ${isVerified ? 'badge-verified' : 'badge-generated'}">${isVerified ? '✓ Verified' : 'Generated'}</span>
        </div>

        <div class="section-label">Question</div>
        <div class="latex-question" id="q-stmt-${box.id}">${q.statement || ''}</div>

        <div class="section-label">Solution</div>
        <div class="latex-solution" id="q-sol-${box.id}">${q.solution || ''}</div>

        <div class="section-label">Options</div>
        <div id="q-opts-${box.id}" class="options-wrap">${optionsHtml}</div>

        ${figureUI}

        <div class="fields-grid">
          <div class="field-item"><div class="field-label-sm">Chapter</div><div class="field-value">${q.chapter_title||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Subject</div><div class="field-value">${q.subject||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Type</div><div class="field-value">${q.type||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Level</div><div class="field-value">${q.level||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Max XP</div><div class="field-value">${q.max_xp||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Correct Answer</div><div class="field-value">${q.correct_answer||'—'}</div></div>
          <div class="field-item"><div class="field-label-sm">Tags</div><div class="field-value">${q.tags||''}</div></div>
          <div class="field-item"><div class="field-label-sm">Hint</div><div class="field-value" style="font-size:11px">${q.hint||''}</div></div>
        </div>

        <div class="result-actions">
          <button class="btn btn-amber" onclick="toggleFix(${box.id})">✏️ Fix</button>
          <button class="btn btn-blue" onclick="verifyQuestion(${box.id})" id="verify-btn-${box.id}">✓ Verify</button>
        </div>

        <div class="fix-area" id="fix-area-${box.id}">
          <div class="fix-row">
            <input type="text" placeholder="Describe what to fix, e.g. 'make solution shorter' or 'fix the hint'" id="fix-input-${box.id}">
            <button class="btn btn-primary btn-sm" onclick="fixQuestion(${box.id})">Apply Fix</button>
          </div>
        </div>

        <div id="verify-result-${box.id}"></div>
      `;
    }
    section.appendChild(card);
  });

  document.getElementById('send-btn').disabled = !anyVerified;
  renderMath();
}

function renderMath() {
  document.querySelectorAll('.latex-question, .latex-solution').forEach(el => {
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  });
}

function toggleFix(id) {
  const area = document.getElementById(`fix-area-${id}`);
  area.style.display = area.style.display === 'block' ? 'none' : 'block';
  if (area.style.display === 'block') document.getElementById(`fix-input-${id}`).focus();
}

async function fixQuestion(id) {
  const prompt = document.getElementById(`fix-input-${id}`).value.trim();
  if (!prompt) return;
  const btn = event.target;
  btn.innerHTML = '<span class="loading"></span>Fixing...';
  btn.disabled = true;

  try {
    const res = await fetch('/fix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: results[id], fix_prompt: prompt })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    results[id] = data;
    const box = boxes.find(b => b.id === id);
    if (box) box.verified = false;
    renderResults();
    renderBoxes();
  } catch (e) {
    alert('Fix failed: ' + e.message);
  }
  btn.innerHTML = 'Apply Fix';
  btn.disabled = false;
}

async function verifyQuestion(id) {
  const btn = document.getElementById(`verify-btn-${id}`);
  btn.innerHTML = '<span class="loading"></span>Verifying...';
  btn.disabled = true;

  try {
    const res = await fetch('/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: results[id] })
    });
    const data = await res.json();
    const box = boxes.find(b => b.id === id);

    const resultDiv = document.getElementById(`verify-result-${id}`);
    if (data.correct) {
      resultDiv.innerHTML = `<div class="verify-result verify-ok">✓ Verified — ${data.explanation}</div>`;
      if (box) box.verified = true;
    } else {
      resultDiv.innerHTML = `<div class="verify-result verify-fail">✗ Issue found — ${data.explanation}</div>`;
      if (box) box.verified = false;
    }
    renderResults();
    renderBoxes();
  } catch (e) {
    alert('Verify failed: ' + e.message);
  }
  btn.innerHTML = '✓ Verify';
  btn.disabled = false;
}

async function sendAll() {
  const verified = boxes.filter(b => b.verified && results[b.id]);
  if (verified.length === 0) { alert('Verify at least one question first!'); return; }

  const spreadsheetId = document.getElementById('spreadsheet_id').value.trim();
  const sheetSel = document.getElementById('sheet_selector');
  const sheetName = sheetSel.value;

  if (!spreadsheetId) { alert('Please paste a Spreadsheet ID first.'); return; }
  if (!sheetName) { alert('Please fetch and select a destination sub-sheet first.'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  let questionsPayload = [];

  for (let b of verified) {
      let qData = JSON.parse(JSON.stringify(results[b.id]));

      const toggle = document.getElementById(`toggle-fig-${b.id}`);
      const errorMsg = document.getElementById(`fig-error-${b.id}`);
      const hasFigures = toggle ? toggle.checked : false;

      let qImages = [];
      let sImages = [];

      if (hasFigures) {
    const storedFigures = figureFiles[b.id] || { q: [], s: [] };

    if (storedFigures.q.length === 0 && storedFigures.s.length === 0) {
        if (errorMsg) errorMsg.classList.add('visible');
        alert(`Missing figures for Q${b.id}. Please add them or turn off the switch.`);
        btn.disabled = false;
        return;
    }

    if (errorMsg) errorMsg.classList.remove('visible');

    for (let file of storedFigures.q) qImages.push(await toBase64(file));
    for (let file of storedFigures.s) sImages.push(await toBase64(file));
}

      qData.has_figures = hasFigures;
      qData.question_figures = qImages;
      qData.solution_figures = sImages;

      questionsPayload.push(qData);
  }

  const progressDiv = document.getElementById('send-progress');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');
  progressDiv.style.display = 'block';

  try {
    progressText.textContent = `Sending ${questionsPayload.length} question(s) to Sheets & Telegram…`;
    progressFill.style.width = '50%';

    const res = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
          questions: questionsPayload,
          spreadsheet_id: spreadsheetId,
          sheet_name: sheetName
      })
    });

    const data = await res.json();
    progressFill.style.width = '100%';
    progressText.textContent = data.message || `${data.sent} sent!`;
  } catch (e) {
    progressText.textContent = 'Error: ' + e.message;
  }

  btn.disabled = false;
}

async function retryBox(id) {
  const box = boxes.find(b => b.id === id);
  if (!box) return;
  if (box.images.length === 0) { alert('No images in this box!'); return; }

  const card = document.getElementById(`result-${id}`);
  if (card) {
    card.innerHTML = `
      <div class="result-header">
        <span class="result-title">Q${id}</span>
        <span class="status-badge badge-generated"><span class="loading"></span>Generating...</span>
      </div>
    `;
  }

  delete results[id];
  box.verified = false;

  await generateBox(box);
  renderResults();
  renderBoxes();
}

// ==========================================
// FEATURE: SAVED SETTINGS MEMORY
// ==========================================
document.getElementById('sheet_selector').addEventListener('change', function() {
    if (this.value) localStorage.setItem('savedSheetName', this.value);
});

async function loadSavedSettings() {
    const savedId = localStorage.getItem('savedSpreadsheetId');
    const savedSheet = localStorage.getItem('savedSheetName');

    if (savedId) {
        document.getElementById('spreadsheet_id').value = savedId;
        await fetchSheets();

        if (savedSheet) {
            const selector = document.getElementById('sheet_selector');
            let sheetExists = Array.from(selector.options).some(opt => opt.value === savedSheet);
            if (sheetExists) selector.value = savedSheet;
        }
    }
}

loadSavedSettings();

// Start with 5 boxes
for (let i = 0; i < 5; i++) addBox();
</script>
</body>
</html>

.remove-btn{position:absolute;top:6px;right:6px;background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;line-height:1;padding:2px}
.remove-btn:hover{color:#e24b4b}
.add-box-row{display:flex;justify-content:flex-end;margin-bottom:24px}
.result-section{margin-top:24px}
.result-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;margin-bottom:16px}
.result-card.verified-card{border-color:#1D9E75}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.result-title{font-size:14px;font-weight:600;color:#111}
.status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-generated{background:#e6f1fb;color:#185FA5}
.badge-verified{background:#e1f5ee;color:#085041}
.badge-error{background:#fcebeb;color:#791F1F}
.latex-question{font-size:20px;line-height:1.8;background:#f9f9f7;border-radius:8px;padding:16px;margin-bottom:12px;color:#111}
.latex-solution{font-size:17px;line-height:1.8;background:#f9f9f7;border-radius:8px;padding:16px;margin-bottom:12px;color:#111}
.fields-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:700px){.fields-grid{grid-template-columns:repeat(2,1fr)}}
.field-item{background:#f5f5f3;border-radius:8px;padding:8px 10px}
.field-label{font-size:10px;color:#999;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px}
.field-value{font-size:13px;color:#111;font-weight:500}
.field-value.editable{cursor:pointer;border-bottom:1px dashed #ccc}
.field-value.editable:hover{color:#185FA5}
.result-actions{display:flex;gap:8px;flex-wrap:wrap}
.fix-area{margin-top:12px;display:none}
.fix-area input{width:100%;padding:8px 12px;border:1px solid #d5d5d5;border-radius:8px;font-size:13px;margin-bottom:8px}
.verify-result{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px}
.verify-ok{background:#e1f5ee;color:#085041}
.verify-fail{background:#fcebeb;color:#791F1F}
.send-progress{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;margin-bottom:24px;display:none}
.progress-bar{height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.3s}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#185FA5;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.drop-hint{position:absolute;bottom:8px;font-size:10px;color:#bbb}
input[type=file]{display:none}
</style>
</head>
<body>

<div class="topbar">
  
  <div class="inline-flex items-center bg-white border border-slate-200 shadow-sm rounded-2xl p-1">
      <span class="px-4 py-1.5 text-sm font-black text-slate-800 tracking-tight">
          JEE Question Builder
      </span>
      <div class="w-px h-5 bg-slate-200 mx-1"></div>
      <a href="/validator" target="_blank" class="flex items-center gap-1.5 px-4 py-1.5 text-sm font-bold text-indigo-600 bg-transparent hover:bg-indigo-50 rounded-xl transition-colors cursor-pointer" style="text-decoration: none;">
          QA Validator
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
      </a>
  </div>

  <div class="topbar-right">
    <span id="box-count" style="font-size:12px;color:#888"></span>
    <button class="btn" onclick="addBox()">+ Add Box</button>
    <button class="btn btn-primary" onclick="generateAll()" id="generate-btn">Generate All</button>
    <button class="btn btn-green" onclick="sendAll()" id="send-btn" disabled>Send to Sheets</button>
  </div>
  
</div>

<div class="workspace">

  <div class="mb-6 p-5 border border-gray-300 rounded-lg bg-white shadow-sm flex flex-col md:flex-row gap-4 items-end">
    <div class="flex-1 w-full">
        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Google Spreadsheet ID</label>
        <div class="flex gap-2">
            <input type="text" id="spreadsheet_id" placeholder="Paste ID here (e.g., 1BxiMVs0XRY...)" class="flex-1 p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" style="display:block;">
            <button onclick="fetchSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition-colors">Fetch Sheets</button>
        </div>
    </div>
    <div class="flex-1 w-full">
        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Select Sub-Sheet</label>
        <select id="sheet_selector" class="w-full p-2 border border-gray-300 rounded text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">Fetch sheets first...</option>
        </select>
    </div>
  </div>

  <div class="send-progress" id="send-progress">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px">Sending to Google Sheets & Telegram...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="progress-text" style="font-size:13px;color:#888">0 / 0 sent</div>
  </div>

  <div class="grid" id="box-grid"></div>
  <div class="add-box-row">
    <button class="btn" onclick="addBox()">+ Add Box</button>
  </div>
  <div class="result-section" id="result-section"></div>
</div>

<script>
let boxes = [];
let results = {};
let boxCounter = 0;

async function fetchSheets() {
    const sheetId = document.getElementById('spreadsheet_id').value.trim();
    if (!sheetId) return alert('Please paste a Spreadsheet ID');
    
    // Save the ID to the user's browser
    localStorage.setItem('savedSpreadsheetId', sheetId);
    
    const selector = document.getElementById('sheet_selector');
    selector.innerHTML = '<option value="">Loading...</option>';
    
    try {
        const res = await fetch(`/get_sheets?spreadsheet_id=${sheetId}`);
        const data = await res.json();
        
        if (data.sheets) {
            selector.innerHTML = '<option value="">Select a sheet...</option>';
            data.sheets.forEach(name => {
                selector.innerHTML += `<option value="${name}">${name}</option>`;
            });
            selector.classList.remove('bg-gray-50');
            selector.classList.add('bg-white');
        } else {
            selector.innerHTML = '<option value="">⚠ Error loading sheets</option>';
            alert('Error fetching sheets: ' + data.error);
        }
    } catch (e) {
        alert('Server error while fetching sheets.');
    }
}

function toggleFigures(id) {
    const container = document.getElementById(`figures-container-${id}`);
    const checkbox = document.getElementById(`toggle-fig-${id}`);
    if (checkbox.checked) {
        container.classList.remove('hidden');
    } else {
        container.classList.add('hidden');
    }
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

function addBox() {
  boxCounter++;
  const id = boxCounter;
  boxes.push({ id, images: [], solutionIncluded: true, verified: false });
  renderBoxes();
  updateCount();
}

function removeBox(id) {
  boxes = boxes.filter(b => b.id !== id);
  delete results[id];
  renderBoxes();
  renderResults();
  updateCount();
}

function updateCount() {
  const filled = boxes.filter(b => b.images.length > 0).length;
  document.getElementById('box-count').textContent = filled > 0 ? `${filled} box${filled>1?'es':''} ready` : '';
}

function renderBoxes() {
  const grid = document.getElementById('box-grid');
  grid.innerHTML = '';
  boxes.forEach(box => {
    const div = document.createElement('div');
    div.className = 'box' + (box.images.length > 0 ? ' has-images' : '') + (results[box.id] ? (box.verified ? ' verified' : ' generated') : '');
    div.dataset.id = box.id;
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => { e.preventDefault(); div.classList.remove('drag-over'); handleDrop(box.id, e.dataTransfer.files); });

    if (box.images.length === 0) {
      div.innerHTML = `
        <div class="box-empty-icon">📎</div>
        <div class="box-empty-text">Drop images here</div>
        <div class="drop-hint">or click to browse</div>
      `;
      div.onclick = () => browseFiles(box.id);
    } else {
      const thumbs = box.images.map(img => `<img class="thumb" src="${img.data}">`).join('');
      div.innerHTML = `
        <button class="remove-btn" onclick="removeBox(${box.id})">×</button>
        <div class="box-num">Q${box.id}</div>
        <div class="thumb-row">${thumbs}</div>
        <div class="box-status">${box.images.length} image${box.images.length>1?'s':''}</div>
        <label class="solution-toggle">
          <label class="toggle-switch">
            <input type="checkbox" ${box.solutionIncluded ? 'checked' : ''} onchange="toggleSolution(${box.id}, this.checked)">
            
            <span class="slider"></span>
          </label>
          Solution included
        </label>
        <div style="font-size:10px;color:#aaa;margin-bottom:4px">Click to add more images</div>
      `;
      div.onclick = (e) => { if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('label')) browseFiles(box.id); };
    }
    grid.appendChild(div);
  });
}

function browseFiles(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.accept = 'image/*';
  input.onchange = e => handleFiles(id, e.target.files);
  input.click();
}

function handleDrop(id, files) {
  handleFiles(id, files);
}

function handleFiles(id, files) {
  const box = boxes.find(b => b.id === id);
  if (!box) return;
  const remaining = 6 - box.images.length;
  const toAdd = Array.from(files).slice(0, remaining);
  let loaded = 0;
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const data = e.target.result;
      const b64 = data.split(',')[1];
      box.images.push({ data, b64 });
      loaded++;
      if (loaded === toAdd.length) { renderBoxes(); updateCount(); }
    };
    reader.readAsDataURL(file);
  });
}

function toggleSolution(id, checked) {
  const box = boxes.find(b => b.id === id);
  if (box) box.solutionIncluded = checked;
}

async function generateAll() {
  // Only grab boxes that have images AND haven't been successfully generated yet
  const ready = boxes.filter(b => b.images.length > 0 && !results[b.id]);
  
  if (ready.length === 0) { 
      alert('Add images to at least one box (or all boxes are already generated)!'); 
      return; 
  }

  const btn = document.getElementById('generate-btn');
  btn.disabled = true;

  // LOOP FIX: Process one box at a time instead of all at once
  for (let i = 0; i < ready.length; i++) {
      const currentBox = ready[i];
      
      // Update the button UI so you know it isn't frozen
      btn.innerHTML = `<span class="loading"></span>Generating ${i + 1} of ${ready.length}...`;
      
      // Await pauses the loop until this specific box is completely finished
      await generateBox(currentBox);
      
      // Redraw the screen immediately so you can see the results pop up one by one!
      renderResults();
      renderBoxes();
  }

  // Reset the button when everything is done
  btn.innerHTML = 'Generate All';
  btn.disabled = false;
}

async function generateBox(box) {
  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: box.images.map(i => i.b64), solution_included: box.solutionIncluded })
    });
    
    // Catch if the server entirely crashes (like a 502)
    if (!response.ok) {
        throw new Error(`Server Error: ${response.status} - Application failed to respond`);
        // const errorData = await response.json().catch(() => ({})); 
        // throw new Error(`Server Error: ${errorData.error || response.statusText}`);
    }

    const data = await response.json();
    
    // Catch if Railway sends its own status JSON
    if (data.status === "error") throw new Error(data.message || "Railway proxy timeout");
    // Catch your own backend errors
    if (data.error) throw new Error(data.error);
    
    results[box.id] = data;
  } catch (e) {
    results[box.id] = { error: e.message };
  }
}

function renderResults() {
  const section = document.getElementById('result-section');
  section.innerHTML = '';
  let anyVerified = false;

  boxes.forEach(box => {
    if (!results[box.id]) return;
    const q = results[box.id];
    const isVerified = box.verified;
    if (isVerified) anyVerified = true;

    const card = document.createElement('div');
    card.className = 'result-card' + (isVerified ? ' verified-card' : '');
    card.id = `result-${box.id}`;

    if (q.error) {
      card.innerHTML = `
        <div class="result-header">
          <span class="result-title">Q${box.id}</span>
          <span class="status-badge badge-error">Error</span>
        </div>
        <div style="color:#791F1F;font-size:13px">${q.error}</div>
        <div style="margin-top:8px"><button class="btn btn-sm" onclick="retryBox(${box.id})">Retry</button></div>
      `;
    } else {
      // const options = q.options || [];

      let options = q.options || [];
      if (typeof options === 'string') {
          try {
              options = JSON.parse(options);
          } catch (e) {
              options = [];
          }
      }
      
      const optionsHtml = options.length > 0 ? options.map(o => `
        <div style="font-size:13px;padding:4px 0;color:${o.is_correct?'#085041':'#111'}">
          ${o.is_correct ? '✓' : '○'} <strong>${o.label}.</strong> ${o.text}
        </div>`).join('') : '<div style="font-size:13px;color:#888">Integer type — no options</div>';

      const figureUI = `
        <div class="mt-4 mb-4 p-4 border rounded-lg bg-gray-50 border-gray-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer mb-1">
                <input type="checkbox" id="toggle-fig-${box.id}" onchange="toggleFigures(${box.id})" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                <span class="font-bold text-sm text-gray-800">Does this question contain a Diagram/Figure?</span>
            </label>
            
            <div id="figures-container-${box.id}" class="hidden mt-3 space-y-3 pt-3 border-t border-gray-200">
                <div>
                    <span class="text-xs font-bold text-gray-600 uppercase tracking-wider block mb-1">Question Figures</span>
                    <input type="file" multiple accept="image/*" id="q-figures-${box.id}" class="block w-full text-sm border p-1 bg-white rounded cursor-pointer" style="display:block;">
                </div>
                <div>
                    <span class="text-xs font-bold text-gray-600 uppercase tracking-wider block mb-1">Solution Figures</span>
                    <input type="file" multiple accept="image/*" id="s-figures-${box.id}" class="block w-full text-sm border p-1 bg-white rounded cursor-pointer" style="display:block;">
                </div>
                <p id="fig-error-${box.id}" class="hidden text-red-600 text-xs font-bold mt-1 bg-red-50 p-2 rounded border border-red-200">⚠ Please add figures or turn off the switch.</p>
            </div>
        </div>
      `;

      card.innerHTML = `
        <div class="result-header">
          <span class="result-title">Q${box.id} — ${q.title || ''}</span>
          <span class="status-badge ${isVerified ? 'badge-verified' : 'badge-generated'}">${isVerified ? '✓ Verified' : 'Generated'}</span>
        </div>

        <div style="font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Question</div>
        <div class="latex-question" id="q-stmt-${box.id}">${q.statement || ''}</div>

        <div style="font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Solution</div>
        <div class="latex-solution" id="q-sol-${box.id}">${q.solution || ''}</div>

        <div style="font-size:11px;color:#999;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Options</div>
        <div id="q-opts-${box.id}" style="margin-bottom:12px">${optionsHtml}</div>

        ${figureUI}

        <div class="fields-grid">
          <div class="field-item"><div class="field-label">Chapter</div><div class="field-value">${q.chapter_title||''}</div></div>
          <div class="field-item"><div class="field-label">Subject</div><div class="field-value">${q.subject||''}</div></div>
          <div class="field-item"><div class="field-label">Type</div><div class="field-value">${q.type||''}</div></div>
          <div class="field-item"><div class="field-label">Level</div><div class="field-value">${q.level||''}</div></div>
          <div class="field-item"><div class="field-label">Max XP</div><div class="field-value">${q.max_xp||''}</div></div>
          <div class="field-item"><div class="field-label">Correct Answer</div><div class="field-value">${q.correct_answer||'—'}</div></div>
          <div class="field-item"><div class="field-label">Tags</div><div class="field-value">${q.tags||''}</div></div>
          <div class="field-item"><div class="field-label">Hint</div><div class="field-value" style="font-size:11px">${q.hint||''}</div></div>
        </div>

        <div class="result-actions">
          <button class="btn btn-amber" onclick="toggleFix(${box.id})">✏️ Fix</button>
          <button class="btn btn-blue" onclick="verifyQuestion(${box.id})" id="verify-btn-${box.id}">✓ Verify</button>
        </div>

        <div class="fix-area" id="fix-area-${box.id}">
          <input type="text" placeholder="Describe what to fix, e.g. 'make solution shorter' or 'fix the hint'" id="fix-input-${box.id}" style="display:block;">
          <button class="btn btn-primary btn-sm" onclick="fixQuestion(${box.id})">Apply Fix</button>
        </div>

        <div id="verify-result-${box.id}"></div>
      `;
    }
    section.appendChild(card);
  });

  document.getElementById('send-btn').disabled = !anyVerified;
  renderMath();
}

function renderMath() {
  document.querySelectorAll('.latex-question, .latex-solution').forEach(el => {
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  });
}

function toggleFix(id) {
  const area = document.getElementById(`fix-area-${id}`);
  area.style.display = area.style.display === 'block' ? 'none' : 'block';
  if (area.style.display === 'block') document.getElementById(`fix-input-${id}`).focus();
}

async function fixQuestion(id) {
  const prompt = document.getElementById(`fix-input-${id}`).value.trim();
  if (!prompt) return;
  const btn = event.target;
  btn.innerHTML = '<span class="loading"></span>Fixing...';
  btn.disabled = true;

  try {
    const res = await fetch('/fix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: results[id], fix_prompt: prompt })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    results[id] = data;
    const box = boxes.find(b => b.id === id);
    if (box) box.verified = false;
    renderResults();
    renderBoxes();
  } catch (e) {
    alert('Fix failed: ' + e.message);
  }
  btn.innerHTML = 'Apply Fix';
  btn.disabled = false;
}

async function verifyQuestion(id) {
  const btn = document.getElementById(`verify-btn-${id}`);
  btn.innerHTML = '<span class="loading"></span>Verifying...';
  btn.disabled = true;

  try {
    const res = await fetch('/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: results[id] })
    });
    const data = await res.json();
    const box = boxes.find(b => b.id === id);

    const resultDiv = document.getElementById(`verify-result-${id}`);
    if (data.correct) {
      resultDiv.innerHTML = `<div class="verify-result verify-ok">✓ Verified — ${data.explanation}</div>`;
      if (box) box.verified = true;
    } else {
      resultDiv.innerHTML = `<div class="verify-result verify-fail">✗ Issue found — ${data.explanation}</div>`;
      if (box) box.verified = false;
    }
    renderResults();
    renderBoxes();
  } catch (e) {
    alert('Verify failed: ' + e.message);
  }
  btn.innerHTML = '✓ Verify';
  btn.disabled = false;
}

async function sendAll() {
  const verified = boxes.filter(b => b.verified && results[b.id]);
  if (verified.length === 0) { alert('Verify at least one question first!'); return; }

  const spreadsheetId = document.getElementById('spreadsheet_id').value.trim();
  const sheetSel = document.getElementById('sheet_selector');
  const sheetName = sheetSel.value;

  if (!spreadsheetId) { alert('Please paste a Spreadsheet ID first.'); return; }
  if (!sheetName) { alert('Please fetch and select a destination sub-sheet first.'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  
  let questionsPayload = [];
  
  for (let b of verified) {
      let qData = JSON.parse(JSON.stringify(results[b.id]));
      
      const toggle = document.getElementById(`toggle-fig-${b.id}`);
      const errorMsg = document.getElementById(`fig-error-${b.id}`);
      const hasFigures = toggle ? toggle.checked : false;

      let qImages = [];
      let sImages = [];

      if (hasFigures) {
          const qInput = document.getElementById(`q-figures-${b.id}`);
          const sInput = document.getElementById(`s-figures-${b.id}`);
          
          if (qInput.files.length === 0 && sInput.files.length === 0) {
              errorMsg.classList.remove('hidden');
              alert(`Missing figures for Q${b.id}. Please add them or turn off the switch.`);
              btn.disabled = false;
              return; 
          }
          errorMsg.classList.add('hidden');
          
          for (let file of qInput.files) qImages.push(await toBase64(file));
          for (let file of sInput.files) sImages.push(await toBase64(file));
      }
      
      qData.has_figures = hasFigures;
      qData.question_figures = qImages;
      qData.solution_figures = sImages;
      
      questionsPayload.push(qData);
  }

  const progressDiv = document.getElementById('send-progress');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');
  progressDiv.style.display = 'block';

  try {
    progressText.textContent = `Sending ${questionsPayload.length} question(s) to Sheets & Telegram…`;
    progressFill.style.width = '50%';

    const res = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
          questions: questionsPayload, 
          spreadsheet_id: spreadsheetId,
          sheet_name: sheetName 
      })
    });
    
    const data = await res.json();
    progressFill.style.width = '100%';
    progressText.textContent = data.message || `${data.sent} sent!`;
  } catch (e) {
    progressText.textContent = 'Error: ' + e.message;
  }

  btn.disabled = false;
}

async function retryBox(id) {
  const box = boxes.find(b => b.id === id);
  if (!box) return;
  if (box.images.length === 0) { alert('No images in this box!'); return; }
  
  const card = document.getElementById(`result-${id}`);
  if (card) {
    card.innerHTML = `
      <div class="result-header">
        <span class="result-title">Q${id}</span>
        <span class="status-badge badge-generated"><span class="loading"></span>Generating...</span>
      </div>
    `;
  }
  
  delete results[id];
  box.verified = false;
  
  await generateBox(box);
  renderResults();
  renderBoxes();
}
